<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<title>Web Forge</title>

<style>
  /* ==========================
   GLOBAL STYLES
========================== */

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: 'Arial', sans-serif;
  line-height: 1.6;
  color: #333;
  background-color: #f9f9f9;
}

/* ==========================
   NAVBAR
========================== */

.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #0A2F5A;
  padding: 15px 40px;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  color: gold;
  font-size: 28px;
  font-weight: bold;
}

.nav-links {
  list-style: none;
  display: flex;
  align-items: center;
  padding-left: 0;
}

.nav-links li {
  margin-left: 20px;
}

.nav-links a {
  color: white;
  text-decoration: none;
  font-weight: 500;
  transition: 0.3s;
}

.nav-links a:hover {
  color: gold;
}

.login-btn {
  background: gold;
  padding: 6px 12px;
  border-radius: 5px;
  color: black;
  font-weight: bold;
  transition: 0.3s;
}

.login-btn:hover {
  background: #f1b300;
}

.menu-toggle {
  display: none;
  font-size: 28px;
  color: white;
  cursor: pointer;
}

/* ==========================
   HERO SECTION
========================== */

.hero {
  min-height: 90vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #0A2F5A, #0a1f3a);
  color: white;
  text-align: center;
  padding-bottom: 50px;
}

.hero h1 {
  font-size: clamp(28px, 5vw, 55px);
  margin-bottom: 20px;
}

.hero p {
  font-size: 20px;
  margin-bottom: 30px;
}

.hero button {
  padding: 12px 25px;
  border: none;
  background: gold;
  font-size: 18px;
  cursor: pointer;
  border-radius: 5px;
  transition: 0.3s;
}

.hero button:hover {
  background: #f1b300;
}

/* ==========================
   ABOUT SECTION
========================== */

.about {
  padding: 80px 20px;
  text-align: center;
  background: #f5f5f5;
}

.about h2 {
  font-size: 36px;
  color: #0A2F5A;
  margin-bottom: 30px;
}

.about p {
  max-width: 700px;
  margin: auto;
  font-size: 18px;
  color: #0A2F5A;
}

/* ==========================
   SERVICES SECTION
========================== */

.services {
  padding: 80px 20px;
  text-align: center;
  background: #fff;
}

.services h2 {
  font-size: 36px;
  color: #0A2F5A;
  margin-bottom: 50px;
}

.services-container {
  display: flex;
  justify-content: center;
  gap: 30px;
  flex-wrap: wrap;
}

.service-card {
  background: linear-gradient(145deg, #f5f5f5, #eaeaea);
  padding: 25px;
  border-radius: 12px;
  width: 280px;
  box-shadow: 0 8px 15px rgba(0,0,0,0.1);
  transition: transform 0.3s, box-shadow 0.3s;
}

.service-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 12px 20px rgba(0,0,0,0.2);
}

.service-card h3 {
  color: #0A2F5A;
  margin-bottom: 15px;
}

.service-card p {
  color: #333;
  font-size: 16px;
}

/* ==========================
   SECTIONS GENERAL SPACING
========================== */

section {
  padding-top: 60px;
  padding-bottom: 60px;
}


.hero-btn {
  display: inline-block;
  padding: 12px 25px;
  border: none;
  background: gold;
  font-size: 18px;
  color: black;
  text-decoration: none;
  border-radius: 5px;
  cursor: pointer;
  transition: 0.3s;
}

.hero-btn:hover {
  background: #f1b300;
}

.footer-socials a {
  color: white;
  margin: 0 10px;
  font-size: 18px;
  transition: 0.3s;
}

.footer-socials a:hover {
  color: gold;
}

/* ==========================
   FOOTER
========================== */
.footer {
  background: #0A2F5A;
  color: white;
  padding: 40px 20px;
  text-align: center;
}

.footer-logo {
  font-size: 28px;
  font-weight: bold;
  margin-bottom: 20px;
  color: gold;
}

.footer-links {
  list-style: none;
  display: flex;
  justify-content: center;
  gap: 25px;
  padding-left: 0;
  margin-bottom: 20px;
}

.footer-links li a {
  color: white;
  text-decoration: none;
  transition: 0.3s;
}

.footer-links li a:hover {
  color: gold;
}

.footer p {
  font-size: 14px;
  color: #ddd;
}

/* Responsive Footer */
@media (max-width: 768px) {
  .footer-links {
    flex-direction: column;
    gap: 10px;
  }
}

/* ==========================
   RESPONSIVE DESIGN
========================== */

@media (max-width: 768px) {
  .menu-toggle {
    display: block;
  }

  .nav-links {
    display: none;
    flex-direction: column;
    width: 100%;
    margin-top: 10px;
  }

  .nav-links.active {
    display: flex;
  }

  .nav-links li {
    margin: 10px 0;
  }

  .services-container {
    flex-direction: column;
    align-items: center;
  }

  .hero button {
    width: 80%;
  }
}
</style>

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">

<h2 class="logo">Digital Web</h2>

<div class="menu-toggle" id="menu-toggle">
☰
</div>

<ul class="nav-links" id="nav-links">

<li><a href="index.html">Home</a></li>
<li><a href="about.html">About</a></li>
<li><a href="services.html">Services</a></li>
<li><a href="contact.html">Contact</a></li>
<li><a href="login.html" class="login-btn">Login</a></li>

</ul>

</nav>


<!-- HERO SECTION -->

<section class="hero">

<h1>Building Modern Websites For Smart Businesses</h1>

<p>We design fast, responsive and secure digital solutions</p>

<a href="services.html" class="hero-btn">Get Started</a>

</section>

<!-- FOOTER -->
<footer class="footer">
  <div class="footer-container">
    <h3 class="footer-logo">Digital Web</h3>
    <div class="footer-socials">
  <a href="#"><i class="fab fa-facebook-f"></i></a>
  <a href="#"><i class="fab fa-twitter"></i></a>
  <a href="#"><i class="fab fa-linkedin-in"></i></a>
</div>
    <p>&copy; 2026 Web Forge. All rights reserved.</p>
  </div>
</footer>

<script>
const toggle = document.getElementById("menu-toggle");
const navLinks = document.getElementById("nav-links");

toggle.addEventListener("click", () => {
  navLinks.classList.toggle("active");
});

// --- Load services from JSON ---
fetch('services.json')
  .then(response => response.json())
  .then(data => {
    const container = document.getElementById('services-container');
    data.forEach(service => {
      const card = document.createElement('div');
      card.className = 'service-card';
      card.innerHTML = `
        <h3>${service.title}</h3>
        <p>${service.description}</p>
      `;
      container.appendChild(card);
    });
  })
  .catch(error => console.error('Error loading services:', error));
</script>

</body>

</html>
