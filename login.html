<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Web Forge</title>
<style>
        /* ==========================
   GLOBAL STYLES
========================== */

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: 'Arial', sans-serif;
  line-height: 1.6;
  color: #333;
  background-color: #f9f9f9;
}

/* ==========================
   NAVBAR
========================== */

.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #0A2F5A;
  padding: 15px 40px;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  color: gold;
  font-size: 28px;
  font-weight: bold;
}

.nav-links {
  list-style: none;
  display: flex;
  align-items: center;
  padding-left: 0;
}

.nav-links li {
  margin-left: 20px;
}

.nav-links a {
  color: white;
  text-decoration: none;
  font-weight: 500;
  transition: 0.3s;
}

.nav-links a:hover {
  color: gold;
}

.login-btn {
  background: gold;
  padding: 6px 12px;
  border-radius: 5px;
  color: black;
  font-weight: bold;
  transition: 0.3s;
}

.login-btn:hover {
  background: #f1b300;
}

.menu-toggle {
  display: none;
  font-size: 28px;
  color: white;
  cursor: pointer;
}

/* ==========================
   HERO SECTION
========================== */

.hero {
  min-height: 90vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #0A2F5A, #0a1f3a);
  color: white;
  text-align: center;
  padding-bottom: 50px;
}

.hero h1 {
  font-size: clamp(28px, 5vw, 55px);
  margin-bottom: 20px;
}

.hero p {
  font-size: 20px;
  margin-bottom: 30px;
}

.hero button {
  padding: 12px 25px;
  border: none;
  background: gold;
  font-size: 18px;
  cursor: pointer;
  border-radius: 5px;
  transition: 0.3s;
}

.hero button:hover {
  background: #f1b300;
}

/* ==========================
   ABOUT SECTION
========================== */

.about {
  padding: 80px 20px;
  text-align: center;
  background: #f5f5f5;
}

.about h2 {
  font-size: 36px;
  color: #0A2F5A;
  margin-bottom: 30px;
}

.about p {
  max-width: 700px;
  margin: auto;
  font-size: 18px;
  color: #0A2F5A;
}

/* ==========================
   SERVICES SECTION
========================== */

.services {
  padding: 80px 20px;
  text-align: center;
  background: #fff;
}

.services h2 {
  font-size: 36px;
  color: #0A2F5A;
  margin-bottom: 50px;
}

.services-container {
  display: flex;
  justify-content: center;
  gap: 30px;
  flex-wrap: wrap;
}

.service-card {
  background: linear-gradient(145deg, #f5f5f5, #eaeaea);
  padding: 25px;
  border-radius: 12px;
  width: 280px;
  box-shadow: 0 8px 15px rgba(0,0,0,0.1);
  transition: transform 0.3s, box-shadow 0.3s;
}

.service-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 12px 20px rgba(0,0,0,0.2);
}

.service-card h3 {
  color: #0A2F5A;
  margin-bottom: 15px;
}

.service-card p {
  color: #333;
  font-size: 16px;
}

/* ==========================
   SECTIONS GENERAL SPACING
========================== */

section {
  padding-top: 60px;
  padding-bottom: 60px;
}

/* ==========================
   RESPONSIVE DESIGN
========================== */

@media (max-width: 768px) {
  .menu-toggle {
    display: block;
  }

  .nav-links {
    display: none;
    flex-direction: column;
    width: 100%;
    margin-top: 10px;
  }

  .nav-links.active {
    display: flex;
  }

  .nav-links li {
    margin: 10px 0;
  }

  .services-container {
    flex-direction: column;
    align-items: center;
  }

  .hero button {
    width: 80%;
  }
}

/* ==========================
   CONTACT SECTION
========================== */
.contact {
  padding: 80px 20px;
  text-align: center;
  background: #f5f5f5;
}

.contact h2 {
  font-size: 36px;
  color: #0A2F5A;
  margin-bottom: 20px;
}

.contact p {
  font-size: 18px;
  margin-bottom: 40px;
  color: #0A2F5A;
}

.contact form {
  max-width: 600px;
  margin: auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.contact input,
.contact textarea {
  padding: 12px 15px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 16px;
  resize: none;
}

.contact button {
  padding: 12px 20px;
  border: none;
  background: #0A2F5A;
  color: white;
  font-size: 18px;
  cursor: pointer;
  border-radius: 6px;
  transition: 0.3s;
}

.contact button:hover {
  background: #082040;
}

/* Responsive form */
@media (max-width: 768px) {
  .contact form {
    width: 90%;
  }
}

/* ==========================
   LOGIN SECTION
========================== */
.login {
  padding: 80px 20px;
  text-align: center;
  background: #fff;
}

.login h2 {
  font-size: 36px;
  color: #0A2F5A;
  margin-bottom: 30px;
}

.login form {
  max-width: 400px;
  margin: auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.login input {
  padding: 12px 15px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 16px;
}

.login button {
  padding: 12px 20px;
  border: none;
  background: #0A2F5A;
  color: white;
  font-size: 18px;
  cursor: pointer;
  border-radius: 6px;
  transition: 0.3s;
}

.login button:hover {
  background: #082040;
}

.login p {
  margin-top: 20px;
  color: #0A2F5A;
}

.login p a {
  color: gold;
  text-decoration: none;
}

.login p a:hover {
  text-decoration: underline;
}

/* Responsive */
@media (max-width: 768px) {
  .login form {
    width: 90%;
  }
}
</style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <h2 class="logo">Digital Web</h2>
  <div class="menu-toggle" id="menu-toggle">☰</div>
  <ul class="nav-links" id="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="services.html">Services</a></li>
    <li><a href="contact.html">Contact</a></li>
    <li><a href="login.html" class="login-btn">Login</a></li>
  </ul>
</nav>

<!-- LOGIN SECTION -->
<section class="login">
  <h2>Login to Your Account</h2>
  <form id="login-form">
    <input type="email" name="email" placeholder="Email Address" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>
  <p>Don't have an account? <a href="index.html">Sign up here</a></p>
</section>


<script>
// Hamburger menu
const toggle = document.getElementById("menu-toggle");
const navLinks = document.getElementById("nav-links");

if (toggle) {
  toggle.addEventListener("click", () => {
    navLinks.classList.toggle("active");
  });
}

// Dummy login submission for demo
const loginForm = document.getElementById('login-form');
loginForm.addEventListener('submit', (e) => {
  e.preventDefault();
  alert('Login successful! (demo)');
  window.location="index.html"
});
</script>

</body>
</html>
