   GLOBAL STYLES
========================== */

body {

/* ==========================
   NAVBAR
========================== */

.navbar {

}

.logo {

}

.nav-links {

  align-items: center;
  padding-left: 0;
}

.nav-links li {
  margin-left: 20px;
}

.nav-links a {
  color: white;
  text-decoration: none;
  font-weight: 500;
  transition: 0.3s;
}

.nav-links a:hover {

}

.login-btn {

  padding: 6px 12px;
  border-radius: 5px;
  color: black;
  font-weight: bold;
  transition: 0.3s;
}

.login-btn:hover {

}

.menu-toggle {
  display: none;
  font-size: 28px;
  color: white;
  cursor: pointer;
}

/* ==========================
   HERO SECTION
========================== */

.hero {

  display: flex;

.hero p {

.hero button {

  cursor: pointer;
  border-radius: 5px;

}

.hero button:hover {

}

/* ==========================
   ABOUT SECTION
========================== */

.about {

  text-align: center;
  background: #f5f5f5;
}

.about h2 {

  color: #0A2F5A;
  margin-bottom: 30px;
}

.about p {

  color: #0A2F5A;

/* ==========================
   SERVICES SECTION
========================== */

  font-size: 36px;

  transform: translateY(-5px);

.service-card h3 {

}

.service-card p {
  color: #333;
  font-size: 16px;
}

/* ==========================
   SECTIONS GENERAL SPACING
========================== */

section {
  padding-top: 60px;
  padding-bottom: 60px;
}

/* ==========================
   RESPONSIVE DESIGN
========================== */

@media (max-width: 768px) {
  .menu-toggle {
    display: block;

  .nav-links {

    flex-direction: column;
    width: 100%;

  }

  }

    margin: 10px 0;

<!-- CONTACT SECTION -->
<section class="contact">
  <h2>Contact Us</h2>

<div class="card section">
<h2>Work With Us</h2>

<p>
Send a project request directly. I reply fast.
</p>

<form id="contactForm">

<input type="text"
placeholder="Your Name"
id="clientName"
required
style="width:100%;padding:12px;margin-top:10px;border-radius:10px;border:none;outline:none;">

<input type="email"
placeholder="Your Email"
id="clientEmail"
required
style="width:100%;padding:12px;margin-top:10px;border-radius:10px;border:none;outline:none;">

<input type="text" placeholder="@Your Telegram username (optional)" id="clientTelegram" style="width:100%;padding:12px;margin-top:10px;border-radius:10px;border:none;outline:none;">
<textarea
placeholder="Describe your project"
id="clientMessage"
required
style="width:100%;padding:12px;margin-top:10px;border-radius:10px;border:none;height:100px;"></textarea>

<button
type="submit"
style="margin-top:12px;background:linear-gradient(135deg,#f5c26b,#e2ae4f);border:none;padding:12px 20px;border-radius:10px;font-weight:bold;cursor:pointer;">
Send Request
</button>

</form>

<p id="statusMsg" style="margin-top:10px;font-size:13px;"></p>
  </form>

<script>

function getDevice() {
  return /Mobi|Android/i.test(navigator.userAgent) ? "mobile" : "desktop";
}

function trackClick(platform) {
  Parse.Cloud.run("trackContactClick", {
    platform: platform,
    ref: "portfolio",
    device: getDevice()
  });
}

</script>
<script>

function getSourcePage() {

const params = new URLSearchParams(window.location.search);

if(params.get("source")) {
return params.get("source");
}

return "portfolio-home";

}

</script>


<script>

document.getElementById("contactForm").addEventListener("submit", async function(e){

  e.preventDefault();

  const name = document.getElementById("clientName").value;
  const email = document.getElementById("clientEmail").value;
  const telegram = document.getElementById("clientTelegram").value;
  const message = document.getElementById("clientMessage").value;

  const statusMsg = document.getElementById("statusMsg");

  // ✅ FRONTEND VALIDATION FIRST
  if (!name || !email || !message) {
  statusMsg.innerHTML = "❌ Please fill required fields";
  return;
}

  if (message.length < 5) {
    statusMsg.innerHTML = "❌ Message too short";
    return;
  }

  if (!email.includes("@")) {
    statusMsg.innerHTML = "❌ Invalid email";
    return;
  }

  statusMsg.innerHTML = "Sending...";

  try {

    const ClientRequests = Parse.Object.extend("ClientRequests");
const obj = new ClientRequests();

obj.set("name", name);
obj.set("email", email);
obj.set("telegram", telegram);
obj.set("message", message);
obj.set("device", getDevice());
obj.set("source", getSourcePage());

await obj.save();

    statusMsg.innerHTML = "✅ Message sent successfully, I'll reply you soon through telegram or Gmail";

    document.getElementById("contactForm").reset();

  } catch (error) {

    // 🔥 REAL ERROR FROM BACKEND
    statusMsg.innerHTML = "❌ " + (error.message || error);

    console.error(error);
  }

});


</script>

<script>

if (toggle) {

  });

// Dummy form submission (Fiverr demo)
const form = document.getElementById('contact-form');
form.addEventListener('submit', (e) => {

});
</script>
